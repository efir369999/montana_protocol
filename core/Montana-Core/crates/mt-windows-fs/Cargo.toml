[package]
name = "mt-windows-fs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "mt_windows_fs"
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_IO", "Win32_System_Kernel", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_WindowsProgramming"] }
