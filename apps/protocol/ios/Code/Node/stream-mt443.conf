# 443 = one port for the site, TURN-TLS and the mesh door.
#   alpn mt-door        -> the door, behind TLS terminated here (127.0.0.1:8449 -> 8447)
#   sni turn.montana.*  -> coturn :5349 (TLS passthrough, coturn own cert)
#   everything else     -> local nginx http tier on 127.0.0.1:8443
#
# Why the door lives here: a tunnel or a corporate filter passes what looks like an ordinary visit
# to a website and drops an unusual port. A node knocks on 443 and marks the connection as the door
# from inside the handshake, where only this front reads it.
stream {
    # NODE TELEMETRY (the author's word 23.08: everything visible, absolutely). Every 443 connection
    # names itself: where from, which label it presented, where it is sent, how long it lived
    # and how many bytes passed. Without it "the phone cannot get through" is a story
    # without the other side.
    log_format mt443 '$time_iso8601 $mt443_upstream alpn=$ssl_preread_alpn_protocols sni=$ssl_preread_server_name sent=$bytes_sent recv=$bytes_received sess=$session_time';
    access_log /var/log/nginx/mt443.log mt443;
    map "$ssl_preread_alpn_protocols|$ssl_preread_server_name" $mt443_upstream {
        ~mt-door                 127.0.0.1:8449;
        ~mt-node                 127.0.0.1:8449;
        ~turn\.montana\.quest    127.0.0.1:5349;
        ~stun\.turn              127.0.0.1:5349;
        default                  127.0.0.1:8443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $mt443_upstream;
        proxy_connect_timeout 4s;
    }
    # THE NODE'S DOOR ANSWERS TO SEVERAL NAMES -- NOT FOR CONVENIENCE, FOR REACHABILITY.
    # Measured 23.08 (the author's phone behind a third-party proxy): HTTPS to api.montana.quest passed,
    # while the channel to montana.quest hung forever. The cause: a client tunnel MUST let its own
    # entry name go direct, or it loops onto itself -- and our node, standing on that same name,
    # went around the tunnel into the blocked network. The door's name is apart from the site's
    # name: the certificate is chosen by the name the caller presented.
    map $ssl_server_name $mt_cert {
        api.montana.quest  api.montana.quest;
        cdn.montana.quest  cdn.montana.quest;
        default            montana.quest;
    }
    # The door speaks the mesh protocol, not TLS, so TLS ends here and the bytes travel on bare.
    server {
        listen 127.0.0.1:8449 ssl;
        ssl_certificate     /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;
        proxy_pass 127.0.0.1:8447;
        proxy_timeout 10m;
    }
}
